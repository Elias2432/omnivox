name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build-ios:
    name: Build unsigned IPA (Sideloadly signs it)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate iOS project (CNG)
        run: npx expo prebuild -p ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile', 'package.json', 'app.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        run: pod install --project-directory=ios

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Omnivox.xcworkspace \
            -scheme Omnivox \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            PROVISIONING_PROFILE_SPECIFIER='' \
            archive

      - name: Package IPA
        run: |
          mkdir -p ipa/Payload
          cp -R build/App.xcarchive/Products/Applications/*.app ipa/Payload/
          cd ipa
          zip -qry ../Omnivox.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omnivox-ipa
          path: Omnivox.ipa
          if-no-files-found: error
          retention-days: 30
